[package]
name = "rdep-forwarder"
version = "0.1.0"
edition = "2021"
description = "rdep 公网中转代理：service 注册长连接 + client 会话路由 + 零解析透传"

[lib]
name = "rdep_forwarder"
path = "src/lib.rs"

[[bin]]
name = "rdep-forwarder"
path = "src/main.rs"

[dependencies]
rdep-protocol = { path = "../rdep-protocol" }

tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
postcard = "1"
serde = "1"
anyhow = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
# Web 会话令牌必须用密码学安全随机源（gen_token 依赖）
getrandom = "0.2"
# 口令散列：PBKDF2-HMAC-SHA256（加盐 + 工作因子），替代原先的无盐 SHA-256
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
