[package]
name = "rdep-service"
version = "0.1.0"
edition = "2021"
description = "rdep 服务端：TLS 监听、rdep 协议分发、文件管理、备份/回滚（Phase 1：核心文件能力）"

[dependencies]
rdep-protocol = { path = "../rdep-protocol" }

tokio = { version = "1", features = ["full"] }
postcard = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"

rusqlite = { version = "0.32", features = ["bundled"] }
# Web 会话令牌必须用密码学安全随机源（gen_token 依赖）
getrandom = "0.2"
# 口令散列：PBKDF2-HMAC-SHA256（加盐 + 工作因子），替代原先的无盐 SHA-256
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
axum = "0.7"
thiserror = "1"
tracing = "0.1"
# env-filter：让 RUST_LOG 生效（默认 debug，见 main.rs 初始化）
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "rdep-service"
path = "src/main.rs"

[[bin]]
name = "rdep-selftest"
path = "src/bin/selftest.rs"
